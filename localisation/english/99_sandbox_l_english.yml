 # Scenario events (docs/gdd/Scenarios.md)
 sandbox_nazi_germany_1_t: "The Eastern Question"
 sandbox_nazi_germany_1_d: "From the Oder to the Vistula, the Reich eyes the road east. The General Staff demands a reckoning with the old settlement; the Foreign Ministry urges a steadier hand. Berlin must decide: press our claims, or let the matter cool down?"
 sandbox_nazi_germany_1_a: "Press our claims"
 sandbox_nazi_germany_1_b: "Let it cool down"
 sandbox_nazi_germany_2_t: "Berlin Demands the Corridor"
 sandbox_nazi_germany_2_d: "Berlin demands the Polish Corridor and the free city, and the end of the old eastern settlement. The note speaks of destiny and carries an unmistakable threat of war. Warsaw must answer: yield, or brace for what follows?"
 sandbox_nazi_germany_2_a: "Yield to the demands"
 sandbox_nazi_germany_2_b: "Defy them"
 sandbox_nazi_germany_3_t: "Berlin Demands the West"
 sandbox_nazi_germany_3_d: "Berlin demands the old lands in the west and the end of the French menace. The note carries an unmistakable threat of war. Paris must answer: yield, or brace for what follows?"
 sandbox_nazi_germany_3_a: "Yield to the demands"
 sandbox_nazi_germany_3_b: "Defy them"
 sandbox_nazi_germany_4_t: "An offer from the bloc"
 sandbox_nazi_germany_4_d: "A great power offers a place in its bloc. To accept means leaving any current alignment and joining theirs."
 sandbox_nazi_germany_4_a: "Join them"
 sandbox_nazi_germany_4_b: "Decline"
 sandbox_monarchical_great_britain_1_t: "The Crown's Ambition"
 sandbox_monarchical_great_britain_1_d: "Whitehall redraws the map: the Isles first, then a reckoning with the great powers. The Cabinet must decide: press the Crown's claims, or let the matter cool down?"
 sandbox_monarchical_great_britain_1_a: "Press our claims"
 sandbox_monarchical_great_britain_1_b: "Let it cool down"
 sandbox_monarchical_great_britain_2_t: "London Demands Satisfaction"
 sandbox_monarchical_great_britain_2_d: "London demands that its rival stand down and respect the Crown's primacy. To yield is humiliation; to defy feeds London's resolve."
 sandbox_monarchical_great_britain_2_a: "Yield to the demands"
 sandbox_monarchical_great_britain_2_b: "Defy them"
 sandbox_monarchical_great_britain_3_t: "London Demands Ireland"
 sandbox_monarchical_great_britain_3_d: "Ireland must choose: submit to the Crown or face the full weight of the Empire. To yield hurts; to defy feeds London's resolve."
 sandbox_monarchical_great_britain_3_a: "Yield to the demands"
 sandbox_monarchical_great_britain_3_b: "Defy them"
 sandbox_monarchical_great_britain_4_t: "An offer from the Crown"
 sandbox_monarchical_great_britain_4_d: "A great power offers a place at its camp. To accept means leaving any old alignment behind."
 sandbox_monarchical_great_britain_4_a: "Join them"
 sandbox_monarchical_great_britain_4_b: "Decline"
 sandbox_fascist_america_1_t: "The American Rebirth"
 sandbox_fascist_america_1_d: "A new order rises in Washington, the republic re-forged in the image of power, and the hemisphere must be made to answer. The President must decide: press the claim, or let the matter cool down?"
 sandbox_fascist_america_1_a: "Press our claims"
 sandbox_fascist_america_1_b: "Let it cool down"
 sandbox_fascist_america_2_t: "Washington Demands the North"
 sandbox_fascist_america_2_d: "Washington demands that the northern dominion bend to the new order. To yield is humiliation; to defy feeds Washington's resolve."
 sandbox_fascist_america_2_a: "Yield to the demands"
 sandbox_fascist_america_2_b: "Defy them"
 sandbox_fascist_america_3_t: "Washington Demands the South"
 sandbox_fascist_america_3_d: "Mexico must choose: submit to the new order, or face the full weight of the American war machine. To yield hurts; to defy feeds Washington's resolve."
 sandbox_fascist_america_3_a: "Yield to the demands"
 sandbox_fascist_america_3_b: "Defy them"
 sandbox_fascist_america_4_t: "An offer from the new order"
 sandbox_fascist_america_4_d: "A great power offers a place at its camp. To accept means leaving any old alignment behind."
 sandbox_fascist_america_4_a: "Join them"
 sandbox_fascist_america_4_b: "Decline"

