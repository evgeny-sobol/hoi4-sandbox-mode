 # Scenario events (docs/gdd/Scenarios.md)
 sandbox_axis_1_t: "The Eastern Question"
 sandbox_axis_1_d: "From the Oder to the Vistula, the Reich eyes the road east. The General Staff demands a reckoning with the old settlement; the Foreign Ministry urges a steadier hand. Berlin must decide: press our claims, or let the matter cool down?"
 sandbox_axis_1_a: "Press our claims"
 sandbox_axis_1_b: "Let it cool down"
 sandbox_axis_2_t: "Berlin Demands the Corridor"
 sandbox_axis_2_d: "Berlin demands the Polish Corridor and the free city, and the end of the old eastern settlement. The note speaks of destiny and carries an unmistakable threat of war. Warsaw must answer: yield, or brace for what follows?"
 sandbox_axis_2_a: "Yield to the demands"
 sandbox_axis_2_b: "Defy them"
 sandbox_axis_3_t: "Berlin Demands the West"
 sandbox_axis_3_d: "Berlin demands the old lands in the west and the end of the French menace. The note carries an unmistakable threat of war. Paris must answer: yield, or brace for what follows?"
 sandbox_axis_3_a: "Yield to the demands"
 sandbox_axis_3_b: "Defy them"
 sandbox_axis_4_t: "An offer from the bloc"
 sandbox_axis_4_d: "A great power offers a place in its bloc. To accept means leaving any current alignment and joining theirs."
 sandbox_axis_4_a: "Join them"
 sandbox_axis_4_b: "Decline"
 sandbox_sov_south_1_t: "The Southern Thrust"
 sandbox_sov_south_1_d: "From the Caucasus to the Gulf, the road south beckons the Red Army. The Commissariat demands a drive toward the warm seas; the Foreign Bureau urges caution. Moscow must decide: press our claims, or let the matter cool down?"
 sandbox_sov_south_1_a: "Press our claims"
 sandbox_sov_south_1_b: "Let it cool down"
 sandbox_sov_south_2_t: "Moscow Demands the Straits"
 sandbox_sov_south_2_d: "Moscow demands the Turkish Straits and a naval base on the Aegean. The note speaks of the historical rights of the Slavs and carries an unmistakable threat of war. The government must answer: yield, or brace for what follows?"
 sandbox_sov_south_2_a: "Yield to the demands"
 sandbox_sov_south_2_b: "Defy them"
 sandbox_sov_south_3_t: "Moscow Demands the Gulf"
 sandbox_sov_south_3_d: "Moscow demands a sphere on the Persian Gulf and the oil of the south. The note carries an unmistakable threat of war. The government must answer: yield, or brace for what follows?"
 sandbox_sov_south_3_a: "Yield to the demands"
 sandbox_sov_south_3_b: "Defy them"
 sandbox_sov_south_4_t: "Moscow Demands the Plateau"
 sandbox_sov_south_4_d: "The Soviet Union demands the northern provinces and the oil of the plateau. The note carries an unmistakable threat of war. The government must answer: yield, or brace for what follows?"
 sandbox_sov_south_4_a: "Yield to the demands"
 sandbox_sov_south_4_b: "Defy them"
